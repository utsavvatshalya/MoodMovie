<!DOCTYPE html>
<html>
<head>
    <title>MoodMovie AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded">
        <h1>🎬 MoodMovie AI Search</h1>
        <form method="POST">
            <input type="text" name="mood_query" class="form-control mb-3" placeholder="Describe your mood (e.g. 'Epic space battle' or 'Wholesome family night')">
            <button type="submit" class="btn btn-primary w-100">Search Mood</button>
        </form>
        {% if results %}
            <h3 class="mt-4">Results for: "{{ query }}"</h3>
            <div class="list-group mt-3">
                {% for movie in results %}
                <div class="list-group-item">
                    <h5>{{ movie.title }} <span class="badge bg-success">{{ movie.score }}</span></h5>
                    <p>{{ movie.overview }}</p>
                </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
